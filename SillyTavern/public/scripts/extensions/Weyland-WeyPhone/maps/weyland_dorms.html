<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0, interactive-widget=resizes-content">
<title>Sterling Hall — Weyland University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mynerve&family=Open+Sans:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Cast-site palette */
  --bg:#444444;
  --ink:#222222;
  --ink2:#333333;
  --mut:#555555;
  --mut2:#777777;
  --line:#484848;
  --gold:#FFCC66;
  --gold2:#EEBB66;
  --gold3:#DDBB77;
  --tan:#AA7755;
  --blue:#6688AA;
  --blue2:#446688;
  --pale:#EEEEEE;
  --paper:#e9dfc6;        /* parchment */
  --paper2:#d8c89f;       /* parchment edge */
  --paperShadow:#8c7a4d;
  /* Floor-plan colours (architectural) */
  --pl-bg:#cfc6ad;        /* map background */
  --pl-wall:#2a2418;      /* map outer boundary */
  --pl-wall2:#4a3f28;     /* map inner boundary */
  --pl-room:#f3ead2;      /* unoccupied room */
  --pl-room-occ:#a3d9a5;  /* occupied room */
  --pl-bath:#c69bd4;      /* bathroom */
  --pl-laundry:#7fcfe3;   /* laundry */
  --pl-staff:#ffe066;     /* RA/staff */
  --pl-public:#cfc6ad;    /* public spaces */
}
html,body{
  background:#3a3328;
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(255,204,102,.05), transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(102,136,170,.05), transparent 60%);
  background-color:var(--bg);
  color:var(--ink);
  font-family:'Open Sans',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom, 0px);
}

/* ===== Header ===== */
/* Design matches cast.weybooru.com */
header{
  box-sizing:content-box;
  font-family:'Rajdhani',sans-serif;
  font-weight:500;
  color:white;
  height:3em;
  padding:calc(.5em + env(safe-area-inset-top, 0px)) calc(1em + env(safe-area-inset-right, 0px)) .5em calc(1em + env(safe-area-inset-left, 0px));
  background-color:#551111;
  border-bottom:solid black 1px;
  position:sticky;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;
  font-size:16px;
}
header .logo{
  display:inline-block;
  height:3em;
  width:auto;
}
header .headline{
  display:inline-flex;align-items:baseline;
  text-decoration:none;
  color:white;
  font-size:1.3em;
  margin-left:.4em;
  font-weight:600;
  letter-spacing:.5px;
  white-space:nowrap;
}
header .headline .sub{
  display:inline-block;
  margin-left:.6em;
  color:#e6c8a0;
  font-weight:400;
  font-size:.75em;
  letter-spacing:.3px;
}

/* Header controls */
.hctrls{margin-left:auto;display:flex;align-items:center;gap:.5em}
.ftabs{display:flex;gap:.3em}
.btabs.hidden{display:none}

/* Toggle for enabling registrar.weybooru.com characters */
.registrarToggle{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;font-size:.9em;letter-spacing:1px;
  padding:.35em 1em;border-radius:3px;cursor:pointer;
  background:rgba(0,0,0,.25);color:rgba(255,255,255,.75);
  border:1px dashed rgba(255,255,255,.35);
  /* Scope the hover/active transitions to the visual properties only — using
     `transition: all` causes browser to interpolate the discrete `order`
     property (toggled by the responsive @media block) and freeze the layout
     mid-transition, which prevents the mobile row reflow from taking effect. */
  transition:background-color .15s,color .15s,border-color .15s;
  text-transform:uppercase;
  white-space:nowrap;
}
.registrarToggle:hover{color:#fff;border-color:rgba(255,255,255,.7);background:rgba(0,0,0,.5)}
.registrarToggle.on{
  background:#dfead4;color:#3a4a22;
  border:1px solid #b8c98a;font-weight:700;
}
.ftab{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;font-size:.9em;letter-spacing:1px;
  padding:.35em 1em;border-radius:3px;cursor:pointer;
  background:rgba(0,0,0,.35);color:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.18);
  /* Same reason as .registrarToggle — exclude `order` from `transition: all`. */
  transition:background-color .15s,color .15s,border-color .15s;
  text-transform:uppercase;
}
.ftab:hover{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.5)}
.ftab.on{
  background:#fff;color:#551111;
  border-color:#fff;font-weight:700;
}

/* Font style toggle */
.switch{
  position:relative;
  width:2.5em;
  height:1.5em;
  display:flex;
  margin-left:2.5em;   /* leave room for the cursive/printed icon to its left */
}
.switch input{opacity:0;width:0;height:0}
.switch .icon{
  background-image:url('https://cast.weybooru.com/images/icons/cursive.png');
  background-size:cover;
  width:1.5em;height:1.5em;
  position:absolute;left:-2em;top:0;
}
body.altFont .switch .icon{
  background-image:url('https://cast.weybooru.com/images/icons/printed.png');
}
.slider{
  position:absolute;cursor:pointer;
  top:0;left:0;right:0;bottom:0;
  background-color:#444;
  transition:.4s;
  border-radius:1em;
  border:.1em solid #666;
}
.slider:before{
  position:absolute;content:"";
  height:1em;width:1em;
  left:.25em;bottom:.18em;
  background-color:#888;
  transition:.4s;
  border-radius:50%;
}
.switch input:checked + .slider{background-color:#555}
.switch input:checked + .slider:before{transform:translateX(.88em)}

/* Tooltip typography switches with altFont; room labels stay Rajdhani. */
body.altFont .rnm{font-family:'Rajdhani',sans-serif;font-weight:600}
body.altFont .rn2{font-family:'Open Sans',sans-serif;font-weight:800}
body.altFont .rs{font-family:'Open Sans',sans-serif;font-weight:600}
.wrap{padding:22px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}

/* ===== Map Container ===== */

/* Parchment panel shell */
.panel{
  width:100%;max-width:1180px;
  background:
    linear-gradient(180deg, rgba(255,250,235,.0), rgba(0,0,0,.05) 100%),
    var(--paper);
  border:1px solid #6b5d3a;
  border-radius:10px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 60px rgba(170,119,85,.15),
    0 6px 20px rgba(0,0,0,.5);
  padding:14px 16px;
}
.leg{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2);font-family:'Open Sans',sans-serif;font-weight:600}
.li{display:flex;align-items:center;gap:6px}
.ls{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--pl-wall2);flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sw{width:100%;max-width:none;transform-origin:top left;transition:transform .16s ease;will-change:transform}
/* Keep corner radii in SVG units so rounded edges stay aligned at all scales. */
.sw svg{width:100%;height:auto;display:block}

/* Overlay legend sits inside the map courtyard to use open space. */
.map-stage{position:relative;width:100%;max-width:1180px;display:flex;flex-direction:column;align-items:stretch}
.map-viewport{width:100%;max-height:78dvh;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;scrollbar-width:thin;border-radius:8px}
.map-viewport.is-zoomed{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.map-viewport.is-panning{cursor:grabbing}
.map-tools{position:absolute;z-index:70;top:8px;right:8px;display:flex;gap:4px;padding:4px;border-radius:8px;background:rgba(42,36,26,.86);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.map-tools button{width:34px;height:34px;border:1px solid #6b5d3a;border-radius:5px;background:#efe4c6;color:#3a2f1a;font:700 17px 'Open Sans',sans-serif;cursor:pointer}
.map-tools button:last-child{width:auto;padding:0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.map-gesture-hint{display:none;margin:7px 0 0;text-align:center;color:#c8b890;font:600 11px 'Open Sans',sans-serif;letter-spacing:.02em}
.legend-overlay{
  position:absolute;
  top:4%;
  left:25%;
  right:25%;
  width:auto;
  max-width:none;
  margin:0;
  padding:0;
  z-index:50;
  /* Remove panel chrome and render plain floating text. */
  background:none;
  border:0;
  border-radius:0;
  box-shadow:none;
  /* Two-column legend with aligned swatches. */
  display:grid;
  grid-template-columns:repeat(2, max-content);
  justify-content:center;
  column-gap:32px;
  row-gap:6px;
  align-items:center;
  text-align:left;
}
.legend-overlay .stat{
  grid-column:1 / -1;
  text-align:center;
  margin:0;
}
/* Building tabs keep a dedicated row so legend items do not reflow. */
.legend-overlay #btabs{
  grid-column:1 / -1;
  justify-content:center;
  align-items:center;
  margin-top:6px;
  gap:.4em;
}
/* Match tab size to header controls. */
.legend-overlay #btabs .ftab{
  font-size:14px;
  font-weight:600;
  letter-spacing:1px;
  padding:.35em 1em;
}

/* SVG room states (applies to <rect class="rb"> and <path class="rb">) */
.room{cursor:pointer}
.room .rb{transition:fill .12s,stroke .12s}
.room.e .rb{fill:var(--pl-room);stroke:var(--pl-wall2);stroke-width:1.2}
.room.o .rb{fill:var(--pl-room-occ);stroke:#2e6a30;stroke-width:2}
/* Over-capacity rooms are red for quick scan. */
.room.w .rb{fill:#f5c5bd;stroke:#a8332a;stroke-width:1.6}
.room.e:hover .rb{fill:#fff8e0;stroke:var(--pl-wall)}
.room.o:hover .rb{fill:#c2ebc4;stroke:#1f4e21;stroke-width:2.5}
.room.w:hover .rb{fill:#fbd6cf;stroke:#7a1a14;stroke-width:2}
/* Pinned room highlight: stronger stroke, no glow bleed. */
.room.stuck .rb{stroke:#143812 !important;stroke-width:3 !important}
/* Shared bath overlay */
.pb{fill:var(--pl-bath);stroke:#7a4a8a;stroke-width:1;pointer-events:none}
.rn{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#3a2f1a}
.rnm{font-family:'Mynerve',cursive;font-size:11px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;fill:#5a3a1a}
/* Mobile-only large room number, drawn in the bath-free half of the room.
   Hidden on desktop where the small `.rn` in the narrow strip applies. */
.rn-mobile{display:none}

/* Special spaces */
.sp rect{pointer-events:none}
.sp.ra rect{fill:var(--pl-staff);stroke:#a08a20;stroke-width:1.4}
.sp.lau rect{fill:var(--pl-laundry);stroke:#3a8aa2;stroke-width:1.4}
.sp.bath rect{fill:var(--pl-bath);stroke:#7a4a8a;stroke-width:1.4}
.sp.com rect{fill:var(--pl-public);stroke:var(--pl-wall2);stroke-width:1.2;stroke-dasharray:none}
.sp.stair rect{fill:#b8ad8c;stroke:var(--pl-wall);stroke-width:1.4}
.sp text{font-family:'Rajdhani',sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none;letter-spacing:.5px}
.sp.ra text{fill:#5a4500;font-size:11px}
.sp.lau text{fill:#0a4a5a;font-size:10px}
.sp.com text{fill:#3a2f1a;font-size:10px}
.sp.bath text{fill:#5a2a6a;font-size:8.5px}
.sp.stair text{fill:#3a2f1a;font-size:10px}

/* Corridor — light, slightly textured floor */
.corridor{fill:#e6dcbd;stroke:#e6dcbd;stroke-width:.6;stroke-dasharray:0}
.exterior{fill:#9c8a5c;stroke:#3a2f1a;stroke-width:1.4}  /* outdoor / non-floor */

/* ===== Tooltip ===== */

/* Tooltip — parchment styled */
#tip{position:fixed;pointer-events:none;z-index:300;opacity:0;transition:opacity .12s;max-width:320px;min-width:240px}
#tip.on{opacity:1;pointer-events:auto}
/* Empty mobile tooltip placeholder. */
#tip .ti-empty{display:none}
.ti{
  background:var(--paper);
  background-image:
    linear-gradient(180deg, rgba(255,255,235,.4) 0%, rgba(140,122,77,.12) 100%);
  border:2px solid #6b5d3a;
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 14px 38px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5);
}
.th{
  background:#2a241a;
  color:var(--gold);
  padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #6b5d3a;
}
/* Over-capacity warning above the resident list. */
.tip-warn{
  background:#f5d6cf;
  color:#7a1a14;
  border-bottom:1px solid #c8665a;
  font-family:'Open Sans',sans-serif;
  font-size:11px;font-weight:700;
  letter-spacing:.3px;
  padding:6px 14px;
  display:flex;align-items:center;gap:6px;
}
.tip-warn[hidden]{display:none}
/* Tighten spacing to the first row when warning is visible. */
.tip-warn:not([hidden]) + #tipBody{padding-top:0}
.tip-warn:not([hidden]) + #tipBody .rc:first-child{padding-top:4px}
/* In handwritten mode, warning is plain text only. */
body:not(.altFont) .tip-warn{
  background:transparent;
  color:#7a1a14;
  border:none;
  border-bottom:none;
  font-family:'Mynerve',cursive;
  font-size:14px;font-weight:400;
  letter-spacing:0;
  padding:6px 20px;
}
/* Resident list scrolls internally for long occupancy. */
#tipBody{
  max-height:300px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(140,122,77,.55) transparent;
}
#tipBody::-webkit-scrollbar{width:7px}
#tipBody::-webkit-scrollbar-track{background:transparent}
#tipBody::-webkit-scrollbar-thumb{background:rgba(140,122,77,.55);border-radius:3px}
#tipBody::-webkit-scrollbar-thumb:hover{background:rgba(140,122,77,.8)}
/* Tooltip "Room ###" title — always Rajdhani, matching the room-number labels on the map (NOT affected by the font toggle). */
.trn{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.tct{font-family:'Open Sans',sans-serif;font-size:11px;color:#c8b890;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.rc{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;
  border-bottom:1px solid rgba(140,122,77,.4);
  text-decoration:none;color:inherit;
}
.rc:last-child{border-bottom:none}
/* No hover highlight — the Profile / Images chips already act as the links. */
.rav{
  width:48px;height:48px;border-radius:50%;
  object-fit:cover;object-position:top;flex-shrink:0;
  background:#cfc6ad;
  border:2px solid #8c7a4d;
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
.rfb{
  width:48px;height:48px;border-radius:50%;
  background:#cfc6ad;border:2px solid #8c7a4d;
  display:flex;align-items:center;justify-content:center;
  font-family:'Mynerve',cursive;font-size:22px;font-weight:400;color:#5a4500;
  flex-shrink:0;
}
.ri{flex:1;min-width:0}
/* Character name & summary in the tooltip — handwritten Mynerve by default,
   switched to printed Open Sans when the font toggle is on. */
.rn2{font-family:'Mynerve',cursive;font-weight:400;font-size:18px;color:var(--ink);line-height:1.5;display:flex;align-items:center;gap:6px;min-width:0}
.rn2 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Inline duplicate badge for same-person multi-entries. */
.dup-warn{
  flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;
  border-radius:50%;
  background:#f5d6cf;color:#7a1a14;
  border:1px solid #c8665a;
  font-family:'Open Sans',sans-serif;font-size:11px;font-weight:700;line-height:1;
  text-decoration:none;
  cursor:help;
  transition:all .12s;
}
.dup-warn:hover{background:#c8665a;color:#fff;border-color:#7a1a14}
body:not(.altFont) .dup-warn{
  background:rgba(245,200,190,.65);
  border:1px dashed rgba(120,40,30,.5);
  color:#7a1a14;
  font-family:'Mynerve',cursive;
  font-size:13px;
}
body:not(.altFont) .dup-warn:hover{
  background:rgba(200,102,90,.7);
  color:#fff;
  border-style:solid;
  border-color:#7a1a14;
}
.rs{font-family:'Mynerve',cursive;font-weight:400;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;margin-top:3px}
.rs::before{content:"• ";color:var(--mut2)}
.rd{font-family:'Open Sans',sans-serif;font-size:11px;color:var(--mut2);margin-top:1px}
.actions{display:flex;gap:6px;margin-top:5px}
.act{
  font-family:'Open Sans',sans-serif;font-weight:700;font-size:10px;
  text-decoration:none;text-transform:uppercase;letter-spacing:.4px;
  padding:3px 8px;border-radius:3px;
  background:#2a241a;color:var(--gold2);border:1px solid #6b5d3a;
  display:inline-flex;align-items:center;gap:3px;
  transition:all .12s;
}
.act:hover{background:var(--gold);color:#2a1f0a;border-color:#a07a2a}
.act.alt{background:transparent;color:var(--blue2);border-color:var(--blue2)}
.act.alt:hover{background:var(--blue);color:#fff;border-color:var(--blue2)}
/* Credit chip for community characters — links to the registrar's
   ?filter=owner:<name> page so clicking it lists every character that owner
   has contributed. Inherits the same look as .act.alt; no separate cursor or
   hover override needed now that it's a real <a>. */

/* ── Tooltip — HANDWRITTEN NOTE-CARD MODE (font toggle OFF) ─────────────
   Mirrors the cast.weybooru.com character cards: parchment background image
   from the cast site (card.png), softer dashed dividers, warmer parchment
   tones throughout, larger handwritten name, sticky-note-style action chips.
   When the toggle is ON these overrides drop out and the base "clean box"
   styles above take over. */
body:not(.altFont) #tip{max-width:340px;min-width:260px}
body:not(.altFont) .ti{
  /* Cast-site card.png at a FIXED size sized for the worst case (2 residents).
     Single-resident tooltips end up shorter and the card image gets cropped
     naturally from the bottom. The bg is also slightly oversized horizontally
     and vertically and pushed by a small negative offset, which crops the
     card.png's transparent edge so the drop-shadow doesn't reveal a halo
     around the card. Rounded corners + overflow:hidden hide any remaining
     transparent corner pixels. */
  background-image:url('https://cast.weybooru.com/images/backgrounds/card.png');
  /* Tall enough to cover the worst case: header + 2 polaroid resident rows +
     #tipBody top padding + the 24 px bottom padding on the last .rc.  Single-
     resident cards stay shorter than this and naturally crop the bottom of
     the background image. */
  background-size:108% 400px;
  background-position:center -8px;
  background-repeat:no-repeat;
  background-color:transparent;
  border:none;
  border-radius:0px;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.3);
}
body:not(.altFont) .th{
  /* Sit ABOVE the card's red rule line (near the top of the bg image). */
  background:transparent;
  border:none;
  padding:12px 20px 2px;
}
/* Everything on the note card is handwritten Mynerve EXCEPT the action chips. */
body:not(.altFont) .trn{font-family:'Mynerve',cursive;font-size:18px;font-weight:400;letter-spacing:0;color:#5a3a1a}
body:not(.altFont) .tct{font-family:'Mynerve',cursive;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:#7a6a4a}
/* Push the resident rows below the red rule line. */
body:not(.altFont) #tipBody{padding-top:14px}
body:not(.altFont) .rc{
  border:none;
  padding:8px 20px 10px;
}
/* Add breathing room at the very bottom of the card. */
body:not(.altFont) .rc:last-child{padding-bottom:24px}
/* (no row-hover highlight in note-card mode either) */
/* Polaroid-style portrait: rectangular white frame with thicker bottom edge,
   subtle drop shadow, no border-radius. Replaces the round avatar look. */
body:not(.altFont) .rav,
body:not(.altFont) .rfb{
  width:54px;
  height:68px;
  border-radius:0;
  border:4px solid #fafafa;
  border-bottom-width:14px;
  background:#fafafa;
  box-shadow:0 3px 6px rgba(0,0,0,.4);
  box-sizing:border-box;
  object-fit:cover;
  object-position:top;
}
body:not(.altFont) .rfb{
  font-family:'Mynerve',cursive;
  font-size:26px;
  font-weight:400;
  color:#5a4500;
  display:flex;align-items:center;justify-content:center;
  background:#cfc6ad;
  /* Polaroid frame around the fallback letter */
  box-shadow:0 3px 6px rgba(0,0,0,.4), inset 0 0 0 4px #fafafa, inset 0 -14px 0 #fafafa;
  border:none;
}
body:not(.altFont) .rn2{
  font-size:24px;
  color:#2a1a0a;
  /* Mynerve descenders (g, y, p, q, j) extend ~0.35em below baseline. With
     line-height:1.0 they crash into the .rs summary line below. 1.4 leaves
     ~3 px of clearance at 24 px and stays visually tight. */
  line-height:1.4;
}
body:not(.altFont) .rs{
  font-size:16px;
  color:#5a4030;
  margin-top:2px;
}
body:not(.altFont) .rs::before{color:#8c7a4d}
body:not(.altFont) .rd{
  font-family:'Mynerve',cursive;
  font-size:14px;
  font-weight:400;
  color:#7a6a4a;

/* ===== Responsive ===== */
/* Mobile header: title row + controls row. */
@media (max-width:760px){

     side and the title gets whatever's left. */

  /* Title: flex-basis:0 (instead of `auto`) means the headline doesn't claim
     its intrinsic max-content width during the wrap calculation, so the logo
     and headline stay together on row 1 even when the headline content is
     wider than the remaining space. The headline then grows back up to fill
     the available room and its inner contents wrap. font-size scales down
     on narrower viewports via clamp() so the sub-line still fits without
     overrunning. */
  header .headline{
    flex:1 1 0;

  /* The Registrar toggle padding stays a touch tighter on mobile so the
     three header groups (floor tabs, +Registrar, font toggle) fit on one

     pseudo-element abbreviation hack needed. */
  .registrarToggle{padding:.35em .7em}

  /* Legend overlay on phones: keep the desktop two-column layout but shrink
     the font and tighten the column gap so both columns fit inside the
     ~50%-width overlay even on a 390 px viewport. Single column was a
     stale fallback that fired for any narrow-desktop or laptop-with-sidebar
     viewport ≤760 px and made the legend look like a list instead of the
     intended grid. */
  .legend-overlay{

  .legend-overlay .stat{font-size:10px;padding-top:2px}
  /* Keep building-tab sizing aligned with header controls. */

     box (UCOMMONS at 50 SVG units tall). Two-line text bbox ≈ 2.4× font-size
     (1.1em line spacing + ascender + descender), so 20 px × 2.4 ≈ 48 fits in
     50 with a 1-unit margin top and bottom. */
  .sw .sp.com text{font-size:20px}

  /* Dock tooltip below map on mobile and keep it in normal flow. */
  body:not(.altFont) #tip,

  /* Mobile resident-list cap: desktop's 220 px fits ~2 polaroid rows when the

     row renders ~135 px tall (no compression) so 220 clips the second resident
     in a 2-bed room. 300 px fits two full rows with breathing room and still
     triggers the internal scroll for 3+ residents. */
  #tipBody{max-height:300px}
}
